name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: 패키지 설치
        run: npm ci

      - name: 정적 사이트 빌드
        run: npx vinext build

      - name: GitHub Pages 파일 준비
        run: |
          mv "dist/client/${{ github.event.repository.name }}/_next" dist/client/_next
          rmdir "dist/client/${{ github.event.repository.name }}"
          mkdir -p dist/client/team dist/client/studio
          cp dist/client/team.html dist/client/team/index.html
          cp dist/client/studio.html dist/client/studio/index.html
          touch dist/client/.nojekyll

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
